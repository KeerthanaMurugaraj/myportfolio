name: Update Scholar numbers

# Refreshes scholar.json every day. Google Scholar often blocks requests from
# GitHub's servers; when that happens the run logs a warning, leaves scholar.json
# as it was, and the next day's run tries again. A weekly job on Keerthana's Mac
# runs the same script (scripts/update_and_commit.sh) as a backup.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Google Scholar profile and commit if the numbers changed
        run: bash scripts/update_and_commit.sh
